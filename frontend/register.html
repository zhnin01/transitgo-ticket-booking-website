<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register – TransitGo</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>🚆 TransitGo</h1><p>Book trains and buses across the UK</p></header>
<nav id="nav"></nav>
<main>
<div class="narrow"><h2>Create an account</h2><div id="msg" class="err"></div>
<form id="register" class="card">
  <div class="row"><label>First name <input id="first_name" required></label><label>Last name <input id="last_name" required></label></div>
  <label>Email <input type="email" id="email" required></label>
  <label>Password (8+ characters) <input type="password" id="pw" minlength="8" required></label>
  <label>Phone <input id="phone_no" maxlength="20" required></label>
  <label>Street <input id="street_name" maxlength="100" required></label>
  <div class="row"><label>City <input id="city" maxlength="20" required></label><label>Postcode <input id="postcode" maxlength="10" required></label></div>
  <button class="btn">Create account</button>
  <p class="mu">Already registered? <a href="login.html">Log in</a></p>
</form></div>
</main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body></html>
