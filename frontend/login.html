<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Log in – TransitGo</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>🚆 TransitGo</h1><p>Book trains and buses across the UK</p></header>
<nav id="nav"></nav>
<main>
<div class="narrow"><h2>Log in</h2><div id="msg" class="err"></div>
<form id="login" class="card">

  <label>Password <input type="password" id="pw" required></label>
  <button class="btn">Log in</button>
  <p class="mu">No account? <a href="register.html">Register</a></p>
</form></div>
</main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
